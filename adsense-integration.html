<!-- Google AdSense Integration for EVCalc.io -->

<!-- 
SETUP STEPS:
1. Apply for AdSense at google.com/adsense
2. Add site to AdSense property list
3. Wait for approval (usually 1-2 weeks)
4. Generate ad units in AdSense dashboard
5. Replace placeholder IDs below with your actual ad unit IDs

BEST PRACTICES:
- Auto ads: Easiest (Google places ads automatically)
- Manual placement: More control (specific ad units)
- Use responsive ad units for mobile
- Limit to 3-4 ads per page (better UX, similar revenue)
- Place near calculators (high engagement = higher CPM)
-->

<!-- AUTO ADS (Recommended) -->
<!-- Place in <head> of index.html -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX"
     crossorigin="anonymous"></script>

<!-- MANUAL AD UNITS -->

<!-- 1. Header Banner (728x90 Leaderboard on desktop, responsive on mobile) -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXXXXXXXX"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- 2. Sidebar Unit (300x250 Medium Rectangle) -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXXXXXXXX"
     data-ad-slot="0987654321"
     data-ad-format="rectangle"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- 3. In-Feed Native Ad (Between calculators) -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-format="fluid"
     data-ad-layout-key="-fb+5w+4e-db+86"
     data-ad-client="ca-pub-XXXXXXXXXX"
     data-ad-slot="1122334455"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- 4. Sticky Footer Ad (Mobile) -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXXXXXXXX"
     data-ad-slot="5544332211"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- CSS for ad placement -->
<style>
    .ad-container {
        margin: 2rem auto;
        text-align: center;
        max-width: 728px;
    }
    
    .ad-label {
        font-size: 0.75rem;
        color: #94a3b8;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
    }
    
    @media (max-width: 768px) {
        .desktop-ad {
            display: none;
        }
    }
    
    @media (min-width: 769px) {
        .mobile-ad {
            display: none;
        }
    }
</style>

<!-- Example placement in HTML -->
<div class="ad-container">
    <div class="ad-label">Advertisement</div>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXXXXXX"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<!-- 
EXPECTED REVENUE (1,000 daily users):
- RPM (Revenue Per Mille): $2-8 depending on niche
- EV/automotive niche: Higher CPM ($4-10)
- 1,000 users × 30 days = 30,000 monthly pageviews
- Conservative: 30K × $2 RPM = $60/month
- Moderate: 30K × $5 RPM = $150/month
- Optimistic: 30K × $8 RPM = $240/month

OPTIMIZATION TIPS:
- Test ad placements with AdSense experiments
- Monitor "Page RPM" and "CTR" in AdSense dashboard
- A/B test auto ads vs manual placement
- Block low-paying categories (games, free apps) if they appear
- Use heat maps (Hotjar) to find high-attention zones
-->

<!-- 
ALTERNATIVES TO ADSENSE:
1. Media.net (Yahoo/Bing ads) - Good for tech/auto niche
2. Ezoic (AI-optimized ad placement) - Higher RPM but needs 10K monthly views
3. AdThrive/Mediavine (premium) - Requires 100K monthly pageviews
4. Carbon Ads (developer-focused) - Clean, ethical ads for tech sites
-->
