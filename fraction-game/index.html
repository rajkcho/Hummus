<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction & Division Quest 🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .score-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .score-item {
            text-align: center;
        }
        .score-label { font-size: 0.8rem; color: #666; }
        .score-value { font-size: 1.5rem; font-weight: bold; color: #667eea; }
        .question-type {
            background: #e8f4fd;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #2196F3;
        }
        .question {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #333;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 5px;
            vertical-align: middle;
        }
        .fraction .num { border-bottom: 2px solid #333; padding: 0 8px 4px; }
        .fraction .den { padding: 4px 8px 0; }
        .visual-fraction {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 20px;
        }
        .fraction-piece {
            width: 40px;
            height: 40px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: #f0f0f0;
        }
        .fraction-piece.filled { background: #667eea; }
        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .answer-btn {
            padding: 16px;
            font-size: 1.3rem;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .answer-btn:hover { border-color: #667eea; transform: scale(1.02); }
        .answer-btn.correct { background: #4CAF50; border-color: #4CAF50; color: white; }
        .answer-btn.wrong { background: #f44336; border-color: #f44336; color: white; }
        .feedback {
            font-size: 1.5rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .streak { color: #FF9800; font-weight: bold; }
        .start-screen, .end-screen {
            text-align: center;
        }
        .start-btn, .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .start-btn:hover, .restart-btn:hover { transform: scale(1.05); }
        .mode-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 1rem;
        }
        .mode-btn:hover, .mode-btn.active {
            background: #667eea;
            color: white;
        }
        .hidden { display: none !important; }
        .final-score { font-size: 3rem; color: #667eea; margin: 20px 0; }
        .final-message { font-size: 1.2rem; color: #666; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="start-screen">
            <h1>🎯 Fraction & Division Quest</h1>
            <p style="color: #666; margin: 20px 0;">Grade 4 Math Practice</p>
            <div class="mode-select">
                <button class="mode-btn active" data-mode="mixed">Mixed</button>
                <button class="mode-btn" data-mode="fractions">Fractions</button>
                <button class="mode-btn" data-mode="division">Division</button>
            </div>
            <button class="start-btn" onclick="startGame()">Start Game! 🚀</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <h1>🎯 Fraction & Division Quest</h1>
            <div class="score-bar">
                <div class="score-item">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Question</div>
                    <div class="score-value"><span id="current">1</span>/10</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Streak</div>
                    <div class="score-value streak" id="streak">🔥 0</div>
                </div>
            </div>
            <div class="question-type" id="question-type">Fractions</div>
            <div id="visual-area"></div>
            <div class="question" id="question"></div>
            <div class="answers" id="answers"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="end-screen hidden">
            <h1>🎉 Great Job!</h1>
            <div class="final-score" id="final-score">0</div>
            <div class="final-message" id="final-message"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again! 🔄</button>
        </div>
    </div>

    <script>
        let score = 0;
        let current = 0;
        let streak = 0;
        let mode = 'mixed';
        let questions = [];
        
        // Mode selection
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
            });
        });

        function generateFractionQuestion() {
            const types = ['identify', 'compare', 'equivalent', 'add'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            if (type === 'identify') {
                const den = [2, 3, 4, 5, 10][Math.floor(Math.random() * 5)];
                const num = Math.floor(Math.random() * den) + 1;
                const visual = Array(den).fill(false).map((_, i) => i < num);
                
                return {
                    type: 'Identify the Fraction',
                    visual: visual,
                    question: 'What fraction is shaded?',
                    answer: `${num}/${den}`,
                    options: generateFractionOptions(num, den)
                };
            } else if (type === 'compare') {
                const fracs = [
                    ['1/2', '1/4'], ['1/3', '1/2'], ['2/4', '1/4'], ['3/4', '1/2'],
                    ['1/5', '1/10'], ['2/5', '1/5'], ['3/10', '1/2'], ['2/3', '1/3']
                ];
                const pair = fracs[Math.floor(Math.random() * fracs.length)];
                const [a, b] = Math.random() > 0.5 ? pair : [pair[1], pair[0]];
                const aVal = eval(a), bVal = eval(b);
                const answer = aVal > bVal ? '>' : aVal < bVal ? '<' : '=';
                
                return {
                    type: 'Compare Fractions',
                    visual: null,
                    question: `<span class="fraction"><span class="num">${a.split('/')[0]}</span><span class="den">${a.split('/')[1]}</span></span> ? <span class="fraction"><span class="num">${b.split('/')[0]}</span><span class="den">${b.split('/')[1]}</span></span>`,
                    answer: answer,
                    options: ['<', '>', '=', '≠'].sort(() => Math.random() - 0.5)
                };
            } else if (type === 'equivalent') {
                const equivs = [
                    ['1/2', '2/4'], ['1/2', '5/10'], ['2/4', '4/8'], ['1/5', '2/10'],
                    ['2/3', '4/6'], ['3/4', '6/8'], ['1/4', '2/8'], ['2/5', '4/10']
                ];
                const pair = equivs[Math.floor(Math.random() * equivs.length)];
                const missing = pair[1];
                
                return {
                    type: 'Equivalent Fractions',
                    visual: null,
                    question: `<span class="fraction"><span class="num">${pair[0].split('/')[0]}</span><span class="den">${pair[0].split('/')[1]}</span></span> = ?`,
                    answer: missing,
                    options: generateFractionOptions(parseInt(missing.split('/')[0]), parseInt(missing.split('/')[1]))
                };
            } else {
                // Simple fraction addition with same denominator
                const den = [2, 4, 5, 10][Math.floor(Math.random() * 4)];
                const a = Math.floor(Math.random() * (den - 1)) + 1;
                const b = Math.floor(Math.random() * (den - a)) + 1;
                const sum = a + b;
                
                return {
                    type: 'Add Fractions',
                    visual: null,
                    question: `<span class="fraction"><span class="num">${a}</span><span class="den">${den}</span></span> + <span class="fraction"><span class="num">${b}</span><span class="den">${den}</span></span> = ?`,
                    answer: `${sum}/${den}`,
                    options: generateFractionOptions(sum, den)
                };
            }
        }

        function generateFractionOptions(num, den) {
            const correct = `${num}/${den}`;
            const options = [correct];
            while (options.length < 4) {
                const fakeNum = Math.floor(Math.random() * den) + 1;
                const fakeDen = [2, 3, 4, 5, 10][Math.floor(Math.random() * 5)];
                const fake = `${fakeNum}/${fakeDen}`;
                if (!options.includes(fake)) options.push(fake);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function generateDivisionQuestion() {
            const types = ['basic', 'missing', 'word'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            if (type === 'basic') {
                const divisor = Math.floor(Math.random() * 9) + 2;
                const quotient = Math.floor(Math.random() * 10) + 1;
                const dividend = divisor * quotient;
                
                return {
                    type: 'Division',
                    visual: null,
                    question: `${dividend} ÷ ${divisor} = ?`,
                    answer: quotient.toString(),
                    options: generateNumberOptions(quotient)
                };
            } else if (type === 'missing') {
                const divisor = Math.floor(Math.random() * 9) + 2;
                const quotient = Math.floor(Math.random() * 10) + 1;
                const dividend = divisor * quotient;
                
                return {
                    type: 'Missing Number',
                    visual: null,
                    question: `${dividend} ÷ ? = ${quotient}`,
                    answer: divisor.toString(),
                    options: generateNumberOptions(divisor)
                };
            } else {
                const scenarios = [
                    { items: 'cookies', total: 24, groups: 6, each: 4 },
                    { items: 'stickers', total: 35, groups: 5, each: 7 },
                    { items: 'marbles', total: 18, groups: 3, each: 6 },
                    { items: 'pencils', total: 32, groups: 8, each: 4 },
                    { items: 'books', total: 45, groups: 9, each: 5 }
                ];
                const s = scenarios[Math.floor(Math.random() * scenarios.length)];
                
                return {
                    type: 'Word Problem',
                    visual: null,
                    question: `${s.total} ${s.items} shared equally among ${s.groups} friends. How many each?`,
                    answer: s.each.toString(),
                    options: generateNumberOptions(s.each)
                };
            }
        }

        function generateNumberOptions(correct) {
            const options = [correct.toString()];
            while (options.length < 4) {
                const offset = Math.floor(Math.random() * 5) - 2;
                const fake = Math.max(1, correct + offset + (options.length * (Math.random() > 0.5 ? 1 : -1)));
                if (!options.includes(fake.toString()) && fake !== correct) {
                    options.push(fake.toString());
                }
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function generateQuestions() {
            questions = [];
            for (let i = 0; i < 10; i++) {
                if (mode === 'fractions') {
                    questions.push(generateFractionQuestion());
                } else if (mode === 'division') {
                    questions.push(generateDivisionQuestion());
                } else {
                    questions.push(Math.random() > 0.5 ? generateFractionQuestion() : generateDivisionQuestion());
                }
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            generateQuestions();
            showQuestion();
        }

        function showQuestion() {
            const q = questions[current];
            document.getElementById('question-type').textContent = q.type;
            document.getElementById('question').innerHTML = q.question;
            document.getElementById('feedback').textContent = '';
            
            // Visual
            const visualArea = document.getElementById('visual-area');
            if (q.visual) {
                visualArea.innerHTML = '<div class="visual-fraction">' + 
                    q.visual.map(filled => `<div class="fraction-piece ${filled ? 'filled' : ''}"></div>`).join('') +
                    '</div>';
            } else {
                visualArea.innerHTML = '';
            }
            
            // Answers
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = q.options.map(opt => 
                `<button class="answer-btn" onclick="checkAnswer('${opt}', this)">${opt}</button>`
            ).join('');
        }

        function checkAnswer(selected, btn) {
            const q = questions[current];
            const correct = selected === q.answer;
            
            document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
            
            if (correct) {
                btn.classList.add('correct');
                streak++;
                const points = 10 + (streak > 1 ? streak * 2 : 0);
                score += points;
                document.getElementById('feedback').innerHTML = ['🎉 Correct!', '⭐ Amazing!', '🌟 Great job!', '💪 You got it!'][Math.floor(Math.random() * 4)];
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.answer-btn').forEach(b => {
                    if (b.textContent === q.answer) b.classList.add('correct');
                });
                streak = 0;
                document.getElementById('feedback').innerHTML = `The answer was ${q.answer}`;
            }
            
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = `🔥 ${streak}`;
            
            setTimeout(() => {
                current++;
                document.getElementById('current').textContent = current + 1;
                if (current < 10) {
                    showQuestion();
                } else {
                    endGame();
                }
            }, 1500);
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            
            let message = '';
            if (score >= 120) message = '🏆 Outstanding! You\'re a math superstar!';
            else if (score >= 90) message = '🌟 Excellent work! Keep it up!';
            else if (score >= 60) message = '👍 Good job! Practice makes perfect!';
            else message = '💪 Keep practicing! You\'ll get better!';
            
            document.getElementById('final-message').textContent = message;
        }
    </script>
</body>
</html>
